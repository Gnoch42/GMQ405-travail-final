# Utiliser ce document pour construire un fichier config.yaml
# config.yaml sera untilisé par le code comme paramètres d'entrée

extraction:
  TBE:
    inpath: "C:/Users/TBE_2014_2025.gdb"
    outpath: "data/tbe_data.gpkg"
    force_extraction: FALSE
    
  IEQM:
    inpath: 
    outpath: "data/ieqm_data.gpkg"
    force_extraction: FALSE
    
  SDA:
    inpath: "C:/Users/SDA.gpkg"
    layer: 'mrc_s'
    field: 'MRS_NM_MRC'
    regions: ['La Matanie', 'La Matapédia']

  GRHQ:                          # réseau hydrographique (pour retirer le fleuve)
    inpath: "data/GRHQ"          # dossier des fichiers GRHQ
    outpath: "data/output/st_laurent.gpkg"
    force_extraction: FALSE

hex_grid:
  cellsize: 5000        # Taille de cellule en mètres (5000 = hexagones de 5 km ; adapté à 2 MRC)
  min_coverage: 0.25    # Couverture minimale d'un hexagone pour recevoir une valeur (0-1)
  outpath: "data/hex_grid.gpkg"
  force_creation: FALSE

# --- Paramètres généraux du projet ---
project:
  target_crs: 32198     # CRS projeté cible (mètres). 32198 = NAD83/Québec Lambert.

# --- Zone d'étude : découpage administratif servant de base à la grille ---
# Délimite la grille hexagonale ET découpe les données lourdes (plus la zone est
# petite, plus les traitements sont légers). Choisir le niveau via layer + field :
#   MRC          -> layer: "mrc_s",   field: "MRS_NM_MRC"
#   Municipalité -> layer: "munic_s", field: "MUS_NM_MUN"
# Si cette section est retirée, la zone = emprise (bounding box) de la cible.
study_zone:
  source: "data/SDA.gpkg"
  layer: "mrc_s"
  field: "MRS_NM_MRC"
  regions: ["La Matanie", "La Matapédia"]
  remove: "data/output/st_laurent.gpkg"   # géométrie à soustraire (fleuve St-Laurent)

# --- Variable cible (intensité TBE) ---
target:
  source: "data/tbe_data.gpkg"
  year_field: "ANNEE"          # colonne année
  value_field: "Niveau"        # colonne intensité (ordinale)
  value_type: "ordinal"
  ordinal_levels: ["Léger", "Modéré", "Grave"]   # ordre croissant d'intensité
  agg_method: "mode"

# --- Covariables : AJOUTER ICI les vraies covariables (aucun code à toucher) ---
# Chaque entrée : name, type (raster|vector), value_type (continuous|categorical|
# ordinal), path, field (vecteur) ou band (raster), agg_method (median|mode).
covariates: {}
  # Exemple raster continu :
  # temperature:
  #   type: "raster"
  #   value_type: "continuous"
  #   path: "data/covariates/temp_hiver.tif"
  #   band: 1
  #   agg_method: "median"
  # Exemple polygone catégoriel :
  # essence:
  #   type: "vector"
  #   value_type: "categorical"
  #   path: "data/covariates/essences.gpkg"
  #   field: "ESSENCE"
  #   agg_method: "mode"

# =============================================================================
# COVARIABLES RÉELLES (téléchargement ciblé + construction)
# =============================================================================
# Deux étapes distinctes, lancées séparément du pipeline de modélisation :
#   1. Rscript src/covariate_download.R  -> télécharge les tuiles/fichiers qui
#      intersectent study_zone (idempotent : ignore ce qui est déjà présent).
#   2. Rscript src/covariate_build.R     -> calcule les covariables et écrit un
#      PANEL hex×année en cache, consommé ensuite par l'outil d'évaluation ET
#      par mod_spa_temp (aucun recalcul).
# Ajouter/retirer une covariable = éditer ce YAML uniquement (aucun code).

# --- Sources à télécharger ---
covariate_sources:
  ecoforest:                     # carte écoforestière MFFP (index de feuillets)
    index: "data/Indexes_téléchargement/Indexe_ecoforestier250k.geojson"
    tile_field: "Feuillet250K"   # identifiant de feuillet
    url_field: "Lien_GPKG"       # URL du ZIP contenant la GPKG du feuillet
    download_dir: "data/downloads/ecoforest"   # ZIP + GPKG bruts (volumineux)
    clip_dir: "data/covariates/ecoforest"      # GPKG découpée à la zone (légère)
    stand_layer: "pee_ori"       # couche des peuplements
    essence_table: "essence_ori" # table des % d'essences (clé geocode)
    keep_raw: false              # FALSE = supprimer ZIP+GPKG bruts après découpage

  climate:                       # grilles climatiques RSCQ (NetCDF quotidien)
    links_csv: "data/Indexes_téléchargement/RSCQ/Liens_Telechargements_Grilles_Climat_Quot.csv"
    param_field: "Parametre"
    year_field: "Annee"
    file_field: "Nom_Fichier"
    url_field: "Lien_Telechargement"
    download_dir: "data/downloads/rscq"

# --- Définition des 5 covariables + cache du panel ---
covariates_build:
  cache: "data/covariates/panel_hex.rds"        # panel hex×année (format R)
  cache_gpkg: "data/covariates/panel_hex.gpkg"  # version géographique (SIG)
  force: FALSE                                   # TRUE = tout recalculer
  items:
    prop_hote:                   # proportion sapin baumier + épinettes (essence hôte)
      builder: "ecoforest_host_prop"
      value_type: "continuous"
      temporal: false            # statique (instantané écoforestier)
      host_essences: ["SB", "EB", "EN", "ER"]  # sapin + épinettes (ajouter EO/EU ?)
      forest_cover: ["R", "M", "F"]            # type_couv considéré "forestier"

    age_peuplement:              # âge du peuplement (étage dominant)
      builder: "ecoforest_age"
      value_type: "continuous"
      temporal: false
      age_jeune_inequienne: 30   # âge attribué aux classes JI (jeune inéquienne)
      age_vieux_inequienne: 90   # âge attribué aux classes VI (vieux inéquienne)

    tmin_hiver:                  # température hivernale minimale, par année
      builder: "winter_tmin"
      value_type: "continuous"
      temporal: true             # une valeur par année
      parameter: "TMIN"
      winter_prev_months: [12]   # décembre de l'année t-1
      winter_curr_months: [1, 2] # janvier-février de l'année t

    hist_infest:                 # historique d'infestation cumulé (groupe 1)
      builder: "tbe_history"
      value_type: "continuous"
      temporal: true
      window: 5                  # somme des sévérités sur t-5..t-1
      groups: ["group1"]         # utilisée en prédiction uniquement

    dist_foyer:                  # distance au foyer actif le plus proche (groupe 1)
      builder: "tbe_distance"
      value_type: "continuous"
      temporal: true
      active_levels: ["Modéré", "Grave"]  # "actif" = modéré ou grave à t-1
      groups: ["group1"]

# --- Données simulées (démo). Mettre use_simulated: FALSE pour les vraies données ---
simulate:
  use_simulated: TRUE
  seed: 42
  n_years: 12
  extent_km: 200

# --- Modèles ---
models:
  group1:                        # prédiction t+1
    run: ["markov", "rf", "convlstm"]
    temporal_split:              # bornes INCLUSIVES sur l'année de départ (t)
      train_years: [2014, 2021]
      valid_years: [2022, 2022]
      test_years:  [2023, 2024]
  group2:                        # analyse à un instant t
    year_t: 2021
    run: ["ols", "slx", "sar", "sem", "durbin", "durbin_error", "gam"]

# --- Analyse de dynamique spatiale (LISA + geo-c-means) ---
lisa_analysis:
  start: 2014            # première année analysée
  end:   2025            # dernière année analysée
  alpha: 0.05            # seuil de significativité du I de Moran local

geocmeans:
  k: 4                   # nombre de classes (typologie temporelle)
  m: 1.6                 # paramètre de flou (optimisé)
  alpha: 0.6             # poids de la composante spatiale (optimisé)
  group_mean_thr: 0.25   # seuil d'appartenance pour l'agrégation par groupe

# --- Sorties : racine unique, subdivisée par étape ---
# Sous-dossiers créés automatiquement sous `root` :
#   ampleur/  dynamique/  covariables/  economie/  prediction/  cartes/
output:
  root: "outputs"

# --- Évaluation comparative des modèles (src/model_evaluation.R) ---
# CV par blocs spatiaux (généralisation dans l'espace) + test temporel sur la
# phase de déclin réservée (généralisation dans le temps). Même découpage pour
# les trois modèles. Par défaut, réutilise le découpage temporel du groupe 1 ;
# renseigner train_years/test_years pour désigner explicitement la phase de déclin.
evaluation:
  n_spatial_blocks: 4          # nombre de blocs spatiaux contigus (3 à 5)
  train_years: [2014, 2021]    # cycle(s) d'entraînement
  test_years:  [2023, 2024]    # phase de déclin réservée (test temporel)
  outdir: "outputs/prediction"

# --- ConvLSTM (réseau spatio-temporel, groupe 1) ---
# Nécessite le backend torch : torch::install_torch() (téléchargement unique).
# Voir src/model_convlstm.R. Ne participe qu'au test temporel (pas à la CV
# spatiale, non définie pour un réseau raisonnant sur la carte entière).
convlstm:
  raster_res: 2000     # résolution (m) de la rastérisation cible/covariables
  seq_len: 4           # longueur de séquence (années) en entrée
  hidden: 16           # canaux cachés de la couche ConvLSTM
  epochs: 60           # itérations d'entraînement
  lr: 0.01             # taux d'apprentissage
  use_covariates: true # ajouter les covariables comme canaux additionnels
